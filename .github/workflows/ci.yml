name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Cài phụ thuộc
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check app tests wsgi.py
          ruff format --check app tests wsgi.py

      - name: Nội dung nạp được và đủ số bài tối thiểu
        run: python -c "from app import create_app; create_app()"

      - name: Test
        run: pytest
